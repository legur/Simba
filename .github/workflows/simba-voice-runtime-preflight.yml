name: MSC WarmBaritone narration one run
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: msc-warmbaritone-20261107-once
  cancel-in-progress: false
jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'google-api-python-client>=2.140,<3' 'google-auth>=2.30,<3' 'google-auth-httplib2>=0.2,<1'
      - name: Synthesize approved narration and archive in private Drive
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import base64
          exec(compile(base64.b64decode(''), 'msc-narration.py', 'exec'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msc-warmbaritone-audio
          path: msc-warmbaritone-output/
          if-no-files-found: ignore
          retention-days: 3
