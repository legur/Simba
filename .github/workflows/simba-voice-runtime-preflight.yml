name: Simba approved voice runtime preflight (read-only)

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  private-voice-check:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.title == 'Simba approved WarmBaritone runtime preflight 2026-11-07' &&
      github.event.issue.user.login == 'legur' &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Drive OAuth client
        run: python -m pip install "google-api-python-client>=2.140,<3" "google-auth>=2.30,<3" "google-auth-httplib2>=0.2,<1"
      - name: Verify approved Simba voice resolvable without synthesis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, 'integrations/video')
          import simba_voice
          assert os.environ.get('GEMINI_API_KEY'), 'GEMINI_API_KEY missing'
          approved = simba_voice.approved_profile()
          assert approved['profile'] == 'WarmBaritone'
          assert simba_voice.voice_id_from_private_store().startswith('voice_')
          print('PASS: Simba WarmBaritone approved, private Drive voice ID resolvable, Gemini key present.')
          print('No TTS generation, no audio outputs, no spending.')
          PY
