name: Studio v2 secure owner selection inbox (NO RENDER)

on:
  pull_request:
    paths:
      - '.github/workflows/motionlab-v2-secure-inbox.yml'
      - 'integrations/materials/motionlab/drive_handoff/Code.gs'
      - 'integrations/materials/motionlab/drive_handoff/CodeV2.gs'
      - 'integrations/materials/motionlab/drive_handoff/issue_v2_ticket.py'
      - 'integrations/materials/motionlab/drive_handoff/test_issue_v2_ticket.py'
      - 'integrations/materials/motionlab/repo-tests/test_drive_v2_inbox.mjs'
      - 'integrations/materials/motionlab/studio-v2.html'
      - 'integrations/materials/motionlab/studio-v2.css'
      - 'integrations/materials/motionlab/studio-v2.js'

permissions:
  contents: read

jobs:
  secure_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install only local video-contract dependencies
        run: python -m pip install --disable-pip-version-check numpy soundfile pillow
      - name: Confirm FFmpeg is local and not cloud
        run: |
          command -v ffmpeg
          command -v ffprobe
      - name: Validate additive v1/v2 Apps Script and browser JavaScript
        run: |
          node --check integrations/materials/motionlab/studio-v2.js
          node --check integrations/materials/motionlab/repo-tests/test_drive_v2_inbox.mjs
          node --test integrations/materials/motionlab/repo-tests/test_drive_v2_inbox.mjs
          node --test integrations/materials/motionlab/repo-tests/test_drive_handoff.mjs
          node --test integrations/materials/motionlab/repo-tests/test_montage_active_queue.mjs
      - name: Validate private v2 issuer against actual synthetic decoded MP4s
        run: |
          python -m py_compile integrations/materials/motionlab/drive_handoff/issue_v2_ticket.py
          python -m unittest discover -s integrations/materials/motionlab/drive_handoff -p 'test_issue_v2_ticket.py' -v
