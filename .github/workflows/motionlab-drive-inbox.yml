name: MotionLab — private Drive inbox to Montage (no video render)

on:
  pull_request:
    paths:
      - 'integrations/materials/motionlab/drive_handoff/**'
      - '.github/workflows/motionlab-drive-inbox.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
        description: 'Read-only check; do not create Montage issues'
  schedule:
    - cron: '11,41 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: simba-motionlab-drive-inbox
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Offline ticket and notifier tests
        run: python -m unittest discover -s integrations/materials/motionlab/drive_handoff -p 'test_*.py' -v

  inbox:
    needs: test
    if: ${{ (github.event_name == 'schedule' && vars.MOTIONLAB_DRIVE_INBOX_ENABLED == 'true') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'google-api-python-client>=2.140,<3' 'google-auth>=2.30,<3' 'google-auth-httplib2>=0.2,<1'
      - name: Notify Montage of verified stored receipts; never render
        env:
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = 'false' ] || [ "${{ github.event_name }}" = 'schedule' ]; then
            python integrations/materials/motionlab/drive_handoff/notify_montage.py --send-notifications
          else
            python integrations/materials/motionlab/drive_handoff/notify_montage.py
          fi
