name: MotionLab — on-demand Drive inbox to free Montage render
run-name: "MotionLab receipt ${{ inputs.receipt_file_id || 'manual' }}"

on:
  pull_request:
    paths:
      - 'integrations/materials/motionlab/drive_handoff/**'
      - '.github/workflows/motionlab-drive-inbox.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
        description: 'Read-only by default; owner can explicitly run free render'
      receipt_file_id:
        type: string
        required: false
        description: 'Exact private Drive Inbox file ID from signed Apps Script receipt'


permissions:
  contents: read
  issues: write

concurrency:
  group: simba-motionlab-drive-inbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Drive modules for offline renderer contract tests
        run: python -m pip install --disable-pip-version-check 'google-api-python-client>=2.140,<3' 'google-auth>=2.30,<3' 'google-auth-httplib2>=0.2,<1'
      - name: Offline ticket, receipts and FFmpeg renderer safeguards
        run: python -m unittest discover -s integrations/materials/motionlab/drive_handoff -p 'test_*.py' -v

  inbox:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'google-api-python-client>=2.140,<3' 'google-auth>=2.30,<3' 'google-auth-httplib2>=0.2,<1'
      - name: Notify Montage of verified stored receipts; never render
        env:
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          RECEIPT_FILE_ID: ${{ inputs.receipt_file_id }}
        run: |
          args=()
          if [ -n "$RECEIPT_FILE_ID" ]; then
            if [[ ! "$RECEIPT_FILE_ID" =~ ^[A-Za-z0-9_-]{15,100}$ ]]; then
              echo "Invalid receipt file ID" >&2; exit 2
            fi
            args+=(--receipt-file-id "$RECEIPT_FILE_ID")
          fi
          if [ "$DRY_RUN" = 'false' ] && [ "${{ github.actor }}" = "${{ github.repository_owner }}" ]; then
            python integrations/materials/motionlab/drive_handoff/notify_montage.py --send-notifications "${args[@]}"
          else
            python integrations/materials/motionlab/drive_handoff/notify_montage.py "${args[@]}"
          fi

      - name: Ensure FFmpeg and fonts are available for free local Montage
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || ! test -d /usr/share/fonts/truetype/dejavu; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          fi
          ffmpeg -hide_banner -version | head -n 1
          ffprobe -hide_banner -version | head -n 1
      - name: Render verified owner-approved source-pinned selections with free FFmpeg
        env:
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          MOTIONLAB_NO_PAID_APIS: 'true'
          DRY_RUN: ${{ inputs.dry_run }}
          ACTOR_IS_OWNER: ${{ github.actor == github.repository_owner }}
          RECEIPT_FILE_ID: ${{ inputs.receipt_file_id }}
        run: |
          args=()
          if [ -n "$RECEIPT_FILE_ID" ]; then args+=(--receipt-file-id "$RECEIPT_FILE_ID"); fi
          if [ "$DRY_RUN" = 'false' ] && [ "$ACTOR_IS_OWNER" = 'true' ]; then
            python integrations/materials/motionlab/drive_handoff/auto_render.py --apply "${args[@]}"
          else
            python integrations/materials/motionlab/drive_handoff/auto_render.py "${args[@]}"
          fi

