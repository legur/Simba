name: Simba A2E universal image-to-video
on:
  issues:
    types: [labeled]
  pull_request:
    paths:
      - '.github/workflows/simba-a2e-universal.yml'
      - 'integrations/video/github_a2e_universal.py'
      - 'integrations/video/test_github_a2e_universal.py'
permissions:
  contents: read
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest integrations/video/test_github_a2e_universal.py integrations/video/test_github_a2e_issue_bridge.py -v
  generate:
    if: >-
      github.event_name == 'issues' &&
      github.event.label.name == 'a2e-generate-approved' &&
      github.event.sender.login == 'legur' &&
      github.event.issue.user.login == 'legur' &&
      github.event.issue.pull_request == null
    concurrency:
      group: simba-a2e-universal-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate once under issue limit
        env:
          A2E_API_KEY: ${{ secrets.A2E_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python integrations/video/github_a2e_universal.py --event "$GITHUB_EVENT_PATH" --out "$RUNNER_TEMP/a2e-universal"
      - name: Preserve results and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simba-a2e-universal-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/a2e-universal
          retention-days: 30
          if-no-files-found: warn
      - name: Report outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -f "$RUNNER_TEMP/a2e-universal/report.md" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo legur/Simba --body-file "$RUNNER_TEMP/a2e-universal/report.md"
          else
            gh issue comment "$ISSUE_NUMBER" --repo legur/Simba --body 'No report. Check task history and billing before any retry.'
          fi
