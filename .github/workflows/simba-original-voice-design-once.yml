name: Simba Original Male Voice Design (private one shot)

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: simba-original-voice-design-20261107-once
  cancel-in-progress: false

jobs:
  design:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.title == 'Simba original Russian male voice design 2026-11-07 ONE SHOT' &&
      github.event.issue.user.login == 'legur' &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight code, no paid calls
        run: |
          python -m py_compile integrations/tts/simba_voice_design_once.py integrations/tts/run_male_prague.py
          python -m json.tool integrations/tts/prague_male_voices.json > /dev/null
      - name: Install private Drive client
        run: python -m pip install "google-api-python-client>=2.140,<3" "google-auth>=2.30,<3" "google-auth-httplib2>=0.2,<1"
      - name: Create two persistent male voices and privately archive Russian samples
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: python integrations/tts/simba_voice_design_once.py
      # No upload-artifact: IDs and media are stored only in private Google Drive.
