name: Simba stage 3 - offline public media/privacy regression
on:
  pull_request:
    paths:
      - 'campaigns/bavaria-new-year-2027/project.json'
      - 'campaigns/prague-new-year-2027/project.json'
      - 'campaigns/vietnam-cambodia-2027/storyboard_option_2_SCENE_EDITOR.json'
      - 'integrations/materials/catalog.py'
      - 'integrations/materials/test_private_media_redaction.py'
      - 'integrations/video/make_video.py'
      - 'integrations/video/tests/test_standalone_script_source.py'
      - '.github/workflows/simba-audit-stage3-public-media.yml'
  push:
    branches: [main]
    paths:
      - 'campaigns/bavaria-new-year-2027/project.json'
      - 'campaigns/prague-new-year-2027/project.json'
      - 'campaigns/vietnam-cambodia-2027/storyboard_option_2_SCENE_EDITOR.json'
      - 'integrations/materials/catalog.py'
      - 'integrations/materials/test_private_media_redaction.py'
      - '.github/workflows/simba-audit-stage3-public-media.yml'
permissions:
  contents: read
jobs:
  no_private_locator_in_public_registry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Source syntax (offline)
        run: python -m py_compile integrations/materials/catalog.py integrations/video/make_video.py
      - name: Owner-only data redaction and safe registry checks (offline)
        run: python -m unittest discover -s integrations/materials -p 'test_private_media_redaction.py' -v
