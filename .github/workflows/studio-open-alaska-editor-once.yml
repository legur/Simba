name: "Studio: open owner-only Alaska montage review (one-shot, NO RENDER)"
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/studio-open-alaska-editor-once.yml'
permissions:
  contents: read
jobs:
  issue_review_ticket:
    if: github.repository == 'legur/Simba'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install private owner Drive dependencies
        run: python -m pip install --disable-pip-version-check 'google-api-python-client>=2.140,<3' 'google-auth>=2.30,<3' 'google-auth-httplib2>=0.2,<1'
      - name: Verify existing A2E originals and issue owner-only project link
        env:
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'integrations/materials/motionlab/drive_handoff')
          import issue_ticket as t
          svc=t.drive()
          q="'"+t.LAUNCH_DIR+"' in parents and name = 'Alaska_private_launch_20261112.json' and trashed = false"
          found=svc.files().list(q=q,pageSize=100,fields="nextPageToken,files(id,name,parents,mimeType,size)").execute()
          rows=found.get('files') or []
          if found.get('nextPageToken') or len(rows)!=1:
              raise SystemExit('ALASKA_PRIVATE_LAUNCH_NOT_UNIQUE')
          meta=rows[0]
          if meta.get('parents')!=[t.LAUNCH_DIR]:
              raise SystemExit('ALASKA_LAUNCH_OUTSIDE_OWNER_ARCHIVE')
          source=t.read_approved_launch(svc,meta['id'])
          if (source.get('project_id')!='alaska-voyager-2027' or
              len(source.get('scenes') or [])!=10 or
              len(source.get('preview_assets') or [])!=7):
              raise SystemExit('ALASKA_OWNER_LAUNCH_SHAPE_CHANGED')
          def owner_only(fid):
              result=svc.permissions().list(fileId=fid,fields='nextPageToken,permissions(type,role)',pageSize=100).execute()
              p=result.get('permissions') or []
              if result.get('nextPageToken') or len(p)!=1 or p[0].get('type')!='user' or p[0].get('role')!='owner':
                  raise SystemExit('ALASKA_SOURCE_NOT_OWNER_PRIVATE')
          owner_only(meta['id'])
          for clip in source['preview_assets']:
              info=svc.files().get(fileId=clip['file_id'],fields='id,mimeType,parents,size,trashed').execute()
              if (info.get('trashed') or info.get('parents')!=['1oMtSCcUOMVU6f2yiS72cevr0NQF58EAj']
                  or info.get('mimeType')!='video/mp4' or int(info.get('size') or 0)!=clip['size_bytes']):
                  raise SystemExit('ALASKA_A2E_CLIP_METADATA_CHANGED')
              owner_only(clip['file_id'])
          result=t.issue(svc,meta['id'])
          if not result.get('issued'):
              raise SystemExit('ALASKA_PRIVATE_TICKET_NOT_ISSUED')
          # Deliberately no ticket, launch ID, token, customer details or media in logs.
          print('STUDIO_OWNER_PRIVATE_REVIEW_TICKET_ISSUED; 10 scenes; 7 verified originals; NO RENDER')
          PY
