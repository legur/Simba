name: MotionLab existing Studio — Vietnam Cambodia 2027 private launch

on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: motionlab-vietnam-cambodia-2027-private-launch
  cancel-in-progress: false

jobs:
  stage:
    if: >-
      github.repository == 'legur/Simba'
      && github.event.label.name == 'motionlab-stage-vietnam-2027'
      && github.event.sender.login == 'legur'
      && github.event.issue.user.login == 'legur'
      && github.event.issue.number == 204
      && github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m py_compile integrations/materials/motionlab/drive_handoff/stage_vietnam_2027.py
      - run: python -m pip install --disable-pip-version-check 'google-api-python-client>=2.140,<3' 'google-auth>=2.30,<3' 'google-auth-httplib2>=0.2,<1'
      - name: Create private verified original-video project in EXISTING Studio (no A2E, no render)
        env:
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          python integrations/materials/motionlab/drive_handoff/stage_vietnam_2027.py \
            --report "$RUNNER_TEMP/vietnam-studio-private-launch.json"
      - name: Preserve sanitized receipt for owner inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vietnam-cambodia-2027-studio-v1-launch-receipt
          path: ${{ runner.temp }}/vietnam-studio-private-launch.json
          retention-days: 14
          if-no-files-found: warn
