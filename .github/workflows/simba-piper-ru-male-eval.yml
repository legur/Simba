name: Simba Piper Russian male voice evaluation (private WAV only)

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: simba-piper-ru-male-eval-20261107
  cancel-in-progress: false

jobs:
  piper:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.title == 'Simba Piper two Russian male sample voices 2026-11-07' &&
      github.event.issue.user.login == 'legur' &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline inference and private storage
        run: python -m pip install "piper-tts>=1.3,<2" "google-api-python-client>=2.140,<3" "google-auth>=2.30,<3" "google-auth-httplib2>=0.2,<1"
      - name: Download two official Russian voice models (no paid TTS)
        run: |
          mkdir -p piper-models
          python -m piper.download_voices --download-dir piper-models ru_RU-denis-medium ru_RU-dmitri-medium
          ls -lh piper-models/*.onnx
      - name: Generate Russian WAV and verify private Drive
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: python integrations/tts/piper_russian_male_compare.py
      # No GitHub artifacts, voice files stay private in Drive.
