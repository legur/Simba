name: Simba approved voice private runner
on:
  workflow_dispatch:
    inputs:
      request_sha256:
        description: SHA-256 of the approved request in private Google Drive
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/simba-approved-voice-issue.yml'
      - 'integrations/video/simba_voice.py'
      - 'integrations/video/simba_voice_issue.py'
      - 'integrations/video/tests/test_simba_voice_issue.py'
permissions:
  contents: read
concurrency:
  group: simba-approved-voice-global
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s integrations/video/tests -p 'test_simba_voice_issue.py' -v
  voice:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'legur/Simba' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'legur' &&
      github.triggering_actor == 'legur'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'google-api-python-client>=2.140,<3' 'google-auth>=2.30,<3' 'google-auth-httplib2>=0.2,<1'
      - name: Verify trusted main checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          git diff --exit-code HEAD --
      - name: Synthesize approved voice once and save privately
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: python integrations/video/simba_voice_issue.py --event "$GITHUB_EVENT_PATH" --out "$RUNNER_TEMP/simba-voice"
