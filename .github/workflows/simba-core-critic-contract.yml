      - 'Critic/Critic-5.7.md'
      - 'SIMBA KNOWLEDGE BASE/06_AGENT_WORKFLOWS/CONTENT_PIPELINE.md'
      - 'integrations/core/test_critic_contract.py'
      - '.github/workflows/simba-core-critic-contract.yml'
permissions:
  contents: read
jobs:
  core_invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: CORE consistency checks - no external calls
        run: python -m unittest discover -s integrations/core -p 'test_*.py' -v
