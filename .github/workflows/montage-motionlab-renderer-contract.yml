name: Montage Motion Lab renderer contract (NO PAID CALLS)

on:
  pull_request:
    paths:
      - '.github/workflows/montage-motionlab-renderer-contract.yml'
      - 'integrations/video/motionlab_render_contract.py'
      - 'integrations/video/motionlab_v2_contract.py'
      - 'integrations/video/motionlab_layout_contract.py'
      - 'integrations/video/motionlab_typography_contract.py'
      - 'integrations/video/motionlab_approved_audio.py'
      - 'integrations/video/tests/test_motionlab_approved_audio.py'
      - 'integrations/video/tests/test_motionlab_typography_contract.py'
      - 'integrations/video/tests/test_motionlab_v2_typography.py'
      - 'integrations/video/tests/test_motionlab_render_contract.py'
      - 'integrations/video/tests/test_motionlab_v2_contract.py'
      - 'integrations/video/tests/test_motionlab_visual_layout.py'
      - 'integrations/video/tests/test_motionlab_subtitle_geometry.mjs'
      - 'integrations/video/motionlab_analysis_bundle.py'
      - 'integrations/video/tests/test_motionlab_analysis_bundle.py'
      - 'integrations/video/make_video.py'
      - 'integrations/video/template/film.js'
      - 'integrations/video/template/subtitle_styles.js'
      - 'integrations/video/MOTIONLAB_RENDERER_CONTRACT.md'
      - 'integrations/materials/motionlab/motionlab_selection.py'
  push:
    branches: [main]
    paths:
      - 'integrations/video/motionlab_render_contract.py'
      - 'integrations/video/tests/test_motionlab_render_contract.py'
      - 'integrations/video/make_video.py'
      - 'integrations/video/template/film.js'

permissions:
  contents: read

jobs:
  offline_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install only static loader requirements (never any TTS/A2E credentials)
        run: python -m pip install numpy soundfile pillow
      - name: Require real ffmpeg/ffprobe for MP4 smoke test (no provider calls)
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
      - name: Syntax and existing renderer contract
        run: |
          python -m py_compile integrations/video/make_video.py integrations/video/motionlab_render_contract.py integrations/video/motionlab_v2_contract.py integrations/video/motionlab_layout_contract.py integrations/video/motionlab_typography_contract.py integrations/video/motionlab_analysis_bundle.py
          node --check integrations/video/template/film.js
          node --test integrations/video/tests/test_motionlab_subtitle_geometry.mjs
          python -m unittest discover -s integrations/video/tests -p 'test_motion_lab_transitions.py' -v
          python -m unittest discover -s integrations/video/tests -p 'test_subtitle_styles.py' -v
      - name: New Motion Lab source-pinned zero-paid renderer preflight
        run: |
          python -m unittest discover -s integrations/video/tests -p 'test_motionlab_render_contract.py' -v
          python -m unittest discover -s integrations/video/tests -p 'test_motionlab_v2_contract.py' -v
          python -m unittest discover -s integrations/video/tests -p 'test_motionlab_visual_layout.py' -v
          python -m unittest discover -s integrations/video/tests -p 'test_motionlab_typography_contract.py' -v
          python -m unittest discover -s integrations/video/tests -p 'test_motionlab_approved_audio.py' -v
          python -m unittest discover -s integrations/video/tests -p 'test_motionlab_v2_typography.py' -v
          python -m unittest discover -s integrations/video/tests -p 'test_motionlab_analysis_bundle.py' -v
