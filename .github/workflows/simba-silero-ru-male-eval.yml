name: Simba Silero Russian male evaluation (noncommercial audio only)

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: simba-silero-ru-male-20261107
  cancel-in-progress: false

jobs:
  silero:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.title == 'Simba Silero noncommercial Russian male samples 2026-11-07' &&
      github.event.issue.user.login == 'legur' &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU inference and private Drive dependencies
        run: |
          python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "omegaconf>=2.3,<3" "soundfile>=0.12,<1" "numpy>=1.26,<3" "google-api-python-client>=2.140,<3" "google-auth>=2.30,<3" "google-auth-httplib2>=0.2,<1"
      - name: Generate two no-cost Silero WAV samples (CC-BY-NC, demo ONLY)
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: python integrations/tts/silero_ru_male_compare.py
      # No public artifacts. Noncommercial voice samples must never be used in marketing.
