name: Simba ElevenLabs Free Russian TTS batch 2 (Daniel Chris Eric Callum)

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: simba-elevenlabs-free-ru-batch2-once-20261107
  cancel-in-progress: false

jobs:
  voice-samples:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.title == 'Simba 4 more ElevenLabs Free Russian voices ONE SHOT BATCH2 2026-11-07' &&
      github.event.issue.user.login == 'legur' &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax verification; no credits
        run: |
          python -m py_compile integrations/tts/elevenlabs_free_ru_batch2_once.py
          python -m json.tool integrations/tts/prague_male_voices.json >/dev/null
      - name: Install Google Drive clients
        run: python -m pip install "google-api-python-client>=2.140,<3" "google-auth>=2.30,<3" "google-auth-httplib2>=0.2,<1"
      - name: Create at most 4 Russian MP3s using ElevenLabs Free credits
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: python integrations/tts/elevenlabs_free_ru_batch2_once.py
      # No GitHub public artifacts, no MP4 or monetized publishing.
