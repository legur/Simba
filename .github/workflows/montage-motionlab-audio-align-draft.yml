name: "Montage approved WAV forced-alignment DRAFT (NO PAID CALLS)"

on:
  pull_request:
    paths:
      - '.github/workflows/montage-motionlab-audio-align-draft.yml'
      - 'integrations/video/motionlab_audio_alignment_draft.py'
      - 'integrations/video/tests/test_motionlab_audio_alignment_draft.py'
      - 'integrations/video/motionlab_v2_audio_gate.py'
      - 'integrations/materials/studio_v2_audio_stage.py'

permissions:
  contents: read

jobs:
  private_draft_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify strict word timings without any model, paid key or private data
        run: |
          python -m py_compile integrations/video/motionlab_audio_alignment_draft.py
          python -m unittest discover -s integrations/video/tests -p 'test_motionlab_audio_alignment_draft.py' -v
