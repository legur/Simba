name: Simba remaining Google male voices (private one-shot)

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: simba-google-11-male-voices-20261107
  cancel-in-progress: false

jobs:
  samples:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.title == 'Simba remaining 11 Google male voice samples 2026-11-07 ONE SHOT' &&
      github.event.issue.user.login == 'legur' &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate inputs before calls
        run: |
          python -m py_compile integrations/tts/gemini_remaining_male_once.py integrations/tts/run_male_prague.py
          python -m json.tool integrations/tts/prague_male_voices.json > /dev/null
      - name: Install private Drive API dependencies
        run: python -m pip install "google-api-python-client>=2.140,<3" "google-auth>=2.30,<3" "google-auth-httplib2>=0.2,<1"
      - name: Synthesize once each and save privately (no A2E)
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: python integrations/tts/gemini_remaining_male_once.py
      # No public audio artifacts: private Google Drive only.
