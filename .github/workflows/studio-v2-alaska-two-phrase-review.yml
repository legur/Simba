name: "Studio v2 Alaska: two owner-only WAV pronunciation clips (NO RENDER)"

on:
  pull_request:
    paths:
      - '.github/workflows/studio-v2-alaska-two-phrase-review.yml'
      - 'integrations/video/alaska_two_phrase_review.py'
      - 'integrations/video/tests/test_alaska_two_phrase_review.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/studio-v2-alaska-two-phrase-review.yml'

permissions:
  contents: read

concurrency:
  group: simba-alaska-two-private-qa-clips-once
  cancel-in-progress: false

jobs:
  synthetic_test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Synthetic, wordless PCM excerpt contract
        run: |
          python -m py_compile integrations/video/alaska_two_phrase_review.py
          python -m unittest discover -s integrations/video/tests -p 'test_alaska_two_phrase_review.py' -v

  owner_private_audio_review_clips:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'legur/Simba'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Validate owner main SHA
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "legur/Simba"
          git diff --exit-code HEAD --
      - name: Install only official owner-private Drive client
        run: |
          python -m pip install --disable-pip-version-check \
            'google-api-python-client>=2.140,<3' \
            'google-auth>=2.30,<3' 'google-auth-httplib2>=0.2,<1'
      - name: Extract two unchanged original WAV windows and store privately
        env:
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: python integrations/video/alaska_two_phrase_review.py
      - name: No public speech or auto approval
        if: always()
        run: |
          echo "Private original source and two bounded listening excerpts remain owner-only Google Drive files." >> "$GITHUB_STEP_SUMMARY"
          echo "No text, spoken words, source WAV, MP3 or excerpts copied to GitHub artifacts. No TTS/A2E/paid/render/publish/owner editorial approval." >> "$GITHUB_STEP_SUMMARY"
