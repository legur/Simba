name: Media tooling regression tests

on:
  pull_request:
    paths:
      - integrations/video/opencut_handoff.py
      - integrations/video/tests/test_opencut_handoff.py
      - integrations/materials/catalog.py
      - integrations/materials/test_catalog.py
      - integrations/materials/handoff.py
      - integrations/materials/test_handoff.py
      - integrations/materials/README.md
      - 'campaigns/**/project.json'
      - 'campaigns/**/README.md'
      - 'SIMBA KNOWLEDGE BASE/03_CONTENT_LIBRARY/**'
      - .github/workflows/opencut-handoff-tests.yml
  push:
    branches: [main]
    paths:
      - integrations/video/opencut_handoff.py
      - integrations/video/tests/test_opencut_handoff.py
      - integrations/materials/catalog.py
      - integrations/materials/test_catalog.py
      - integrations/materials/handoff.py
      - integrations/materials/test_handoff.py
      - integrations/materials/README.md
      - 'campaigns/**/project.json'
      - 'campaigns/**/README.md'
      - 'SIMBA KNOWLEDGE BASE/03_CONTENT_LIBRARY/**'
      - .github/workflows/opencut-handoff-tests.yml

permissions:
  contents: read

jobs:
  handoff-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test package and path safety
        run: python3 -m unittest discover -s integrations/video/tests -p test_opencut_handoff.py -v
      - name: Test materials project status and archive safety
        run: python3 -m unittest discover -s integrations/materials -p test_catalog.py -v
      - name: Validate current projects and show next actions
        run: |
          python3 integrations/materials/catalog.py check
          python3 integrations/materials/catalog.py list | tee "$RUNNER_TEMP/simba-project-status.txt"
          {
            echo '### Simba project progress (local registry only)'
            echo '```'
            cat "$RUNNER_TEMP/simba-project-status.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Test validated production stage handoffs
        run: python3 -m unittest discover -s integrations/materials -p test_handoff.py -v
      - name: Generate stage handoff packets without external calls
        run: |
          python3 integrations/materials/handoff.py --json --report-only all > "$RUNNER_TEMP/simba-stage-handoffs.json"
          python3 - "$RUNNER_TEMP/simba-stage-handoffs.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          print('### Simba stage handoff (read-only)')
          for item in data:
              print('- '+item['project_id']+': '+item['state']+' → '+item['recipient'])
              if item['reason']: print('  - Reason: '+item['reason'])
          unsafe = {'PROJECT_INTEGRITY', 'INVALID_STAGE_HANDOFFS',
                    'STAGE_ORDER_GAP', 'INVALID_OR_STALE_STAGE'}
          bad = [x for x in data if x.get('reason') in unsafe]
          if bad:
              raise SystemExit('Invalid stage handoff data: '+', '.join(x['project_id'] for x in bad))
          PY
      - name: Preserve transfer packets for handoff consumers
        uses: actions/upload-artifact@v4
        with:
          name: simba-stage-handoffs
          path: ${{ runner.temp }}/simba-stage-handoffs.json
          retention-days: 7
          if-no-files-found: error
