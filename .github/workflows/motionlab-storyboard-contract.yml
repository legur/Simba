name: Motion Lab storyboard selection contract

on:
  pull_request:
    paths:
      - 'integrations/materials/motionlab/**'
      - '.github/workflows/motionlab-storyboard-contract.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/materials/motionlab/**'
      - '.github/workflows/motionlab-storyboard-contract.yml'

permissions:
  contents: read

jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: No-provider JSON and browser syntax checks
        run: |
          python -m unittest discover -s integrations/materials/motionlab/repo-tests -p 'test_motionlab_selection.py' -v
          python -m py_compile integrations/materials/motionlab/motionlab_selection.py
          python -m unittest discover -s integrations/materials/motionlab/repo-tests -p 'test_site_sources.py' -v
          for file in app.js transitions.js text.js subtitles.js camera.js storyboard.js scene_pages.js visual_editor.js director_core.js director_import_core.js director_import.js director_semantic.js director_analysis.js director_vision_core.js director_vision.js motionlab_host_adapter.js; do
            node --check "integrations/materials/motionlab/$file"
          done
          for test in test_director_semantic.cjs test_director_import_core.cjs test_director_vision_core.cjs; do
            node "integrations/materials/motionlab/repo-tests/$test"
          done
          node --check integrations/materials/motionlab/audio_review_core.js
          node --test integrations/materials/motionlab/repo-tests/test_audio_review.mjs
          node --test integrations/materials/motionlab/repo-tests/test_scene_pages.mjs
          node --test integrations/materials/motionlab/repo-tests/test_drive_v2_inbox.mjs
