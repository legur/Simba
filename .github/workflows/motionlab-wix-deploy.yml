name: Motion Lab — automatic Wix deployment

on:
  pull_request:
    paths:
      - 'integrations/materials/motionlab/*.html'
      - 'integrations/materials/motionlab/*.css'
      - 'integrations/materials/motionlab/*.js'
      - 'integrations/materials/motionlab/deploy_static.py'
      - 'integrations/materials/motionlab/repo-tests/test_deploy_static.py'
      - '.github/workflows/motionlab-wix-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/materials/motionlab/*.html'
      - 'integrations/materials/motionlab/*.css'
      - 'integrations/materials/motionlab/*.js'
      - 'integrations/materials/motionlab/deploy_static.py'
      - '.github/workflows/motionlab-wix-deploy.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to the existing production Wix site (unchecked means validation only)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# Do not cancel or overlap live deployments. No PR has production credentials.
concurrency:
  group: motionlab-wix-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the 16-file static bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check site assets and security guards
        run: |
          python3 -m unittest discover -s integrations/materials/motionlab/repo-tests -p 'test_site_sources.py' -v
          python3 -m unittest discover -s integrations/materials/motionlab/repo-tests -p 'test_deploy_static.py' -v
          python3 integrations/materials/motionlab/deploy_static.py build --bundle "$RUNNER_TEMP/motionlab-site.zip"
      - name: Check public JavaScript syntax
        run: |
          for file in app.js transitions.js text.js subtitles.js camera.js storyboard.js; do
            node --check "integrations/materials/motionlab/$file"
          done
      - name: Validation summary
        if: ${{ success() }}
        run: |
          echo '16 public website files validated. No Wix changes in this job.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Publish Motion Lab to the existing Wix site
    needs: [validate]
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # GitHub Actions secret. Never put the key in Git, Wix static files or logs.
      WIX_API_KEY: ${{ secrets.MOTIONLAB_WIX_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Ensure Wix credentials are configured
        shell: bash
        run: |
          if [[ -z "${WIX_API_KEY:-}" ]]; then
            echo "::error title=Missing Wix API key::Set GitHub Actions secret MOTIONLAB_WIX_API_KEY (site-restricted), then rerun this workflow."
            exit 1
          fi
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Node 24 (Wix CLI minimum)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Authenticate Wix, verify existing site, publish, verify inventory
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund @wix/cli@latest
          wix login --api-key "$WIX_API_KEY" >/dev/null
          ACCESS="$(wix token)"
          if [[ -z "$ACCESS" ]]; then
            echo "::error::Wix CLI failed to issue an account-scoped access token."
            exit 1
          fi
          export WIX_ACCESS_TOKEN="$ACCESS"
          python3 integrations/materials/motionlab/deploy_static.py deploy --bundle "$RUNNER_TEMP/motionlab-site.zip"
          {
            echo '### Motion Lab published to Wix'
            echo 'Existing site: https://headless-cvcdjldqjlx-leostraveltips-140e.wix-site-host.com/'
            echo "Commit: ${GITHUB_SHA}"
            echo 'Sent exactly 16 checked public files (no project metadata, secrets, media or private assets).'
          } >> "$GITHUB_STEP_SUMMARY"
