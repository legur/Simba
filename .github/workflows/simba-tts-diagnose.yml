name: Simba TTS troubleshoot read-only

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read

jobs:
  diagnose:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.title == 'Simba TTS Prague read-only diagnosis 2026-11-07' &&
      github.event.issue.user.login == 'legur' &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check read-only scripts
        run: python -m py_compile integrations/tts/diagnose_prague.py
      - name: Diagnose without generating audio
        env:
          A2E_API_KEY: ${{ secrets.A2E_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python integrations/tts/diagnose_prague.py > "$RUNNER_TEMP/tts-diag.md"
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/tts-diag.md"
      - name: Install Drive client and ffmpeg for read-only preview recovery
        run: |
          python -m pip install "google-api-python-client>=2.140,<3" "google-auth>=2.30,<3" "google-auth-httplib2>=0.2,<1"
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Recover a matching existing A2E audio preview (NO GENERATION)
        env:
          A2E_API_KEY: ${{ secrets.A2E_API_KEY }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile integrations/tts/recover_a2e_prague.py
          python integrations/tts/recover_a2e_prague.py > "$RUNNER_TEMP/tts-recover.md" || echo "Recovery exited unsuccessfully. No new generation was requested." >> "$RUNNER_TEMP/tts-recover.md"
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/tts-recover.md"
