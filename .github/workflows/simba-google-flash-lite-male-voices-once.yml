name: Simba seven Google male Flash-Lite voices (private one-shot)

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: simba-seven-google-male-lite-20261107
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.title == 'Simba seven male voices Gemini Flash Lite 2026-11-07 ONE SHOT' &&
      github.event.issue.user.login == 'legur' &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate script and non-A2E config
        run: |
          python -m py_compile integrations/tts/gemini_remaining_flash_lite_once.py integrations/tts/run_male_prague.py
          python -m json.tool integrations/tts/prague_male_voices.json > /dev/null
      - name: Install private Google Drive dependencies
        run: python -m pip install "google-api-python-client>=2.140,<3" "google-auth>=2.30,<3" "google-auth-httplib2>=0.2,<1"
      - name: Generate each voice once with Flash-Lite; private Drive only
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: python integrations/tts/gemini_remaining_flash_lite_once.py
      # No upload-artifact in public repo, no A2E.
