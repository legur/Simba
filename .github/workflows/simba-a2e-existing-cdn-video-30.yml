name: Simba A2E existing-image one video (max 30 credits)

on:
  issues:
    types: [labeled]
  pull_request:
    paths:
      - ".github/workflows/simba-a2e-existing-cdn-video-30.yml"
      - "integrations/video/github_a2e_prague_existing_cdn_one_video.py"
      - "integrations/video/test_github_a2e_prague_existing_cdn_one_video.py"

permissions:
  contents: read

jobs:
  tests:
    name: Test credit cap and one paid POST
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest integrations/video/test_github_a2e_prague_existing_cdn_one_video.py -v
      - run: python -m unittest integrations/video/test_github_a2e_prague_generate.py -v
      - run: python -m unittest integrations/video/test_github_a2e_prague_upload_one.py -v

  generate_once:
    name: One approved 5-second Charles Bridge video (max 30 credits)
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'a2e-existing-cdn-one-video-30' &&
      github.event.issue.number == 8 &&
      github.event.issue.user.login == 'legur' &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    concurrency:
      group: simba-a2e-issue8-existing-cdn-single-video-20261105
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify existing Genjutsu-readable JPEG, free quote, then exactly one paid POST
        env:
          A2E_API_KEY: ${{ secrets.A2E_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python integrations/video/github_a2e_prague_existing_cdn_one_video.py \
            --event "$GITHUB_EVENT_PATH" \
            --out "$RUNNER_TEMP/a2e-prague-existing-cdn-video" \
            --max-new 30
      - name: Preserve result video, task details and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simba-prague-charles-bridge-one-video
          path: ${{ runner.temp }}/a2e-prague-existing-cdn-video
          if-no-files-found: warn
          retention-days: 30
      - name: Report status to original issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "$RUNNER_TEMP/a2e-prague-existing-cdn-video/report.md" ]; then
            gh issue comment 8 --repo legur/Simba --body-file "$RUNNER_TEMP/a2e-prague-existing-cdn-video/report.md"
          else
            gh issue comment 8 --repo legur/Simba --body "A2E paid start outcome unknown. Never retry without first reconciling A2E tasks and credit ledger."
          fi
