name: Monid travel research
on:
  push:
    branches: [codex/monid-check-20261112]
    paths: [.github/workflows/monid-connection-check.yml]
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve Reddit and Threads discussions
        env:
          MONID_SECRET: ${{ secrets.monid_key }}
          NO_COLOR: '1'
        run: |
          npm install --prefix "$RUNNER_TEMP/monid" @monid-ai/cli@0.1.9 --no-audit --no-fund
          M="$RUNNER_TEMP/monid/node_modules/.bin/monid"
          "$M" keys add -k "$MONID_SECRET" -l github-action
          unset MONID_SECRET
          "$M" run -p anyapi -e /reddit.search -i '{"query":"subreddit:travel","timeframe":"week","sort":"comments"}' -w 40 -j || true
          "$M" run -p tikhub -e /api/v1/threads/web/fetch_post_comments --query '{"post_id":"4028305804780335592"}' -w 40 -j || true
