name: Monid discovery
on:
  push:
    branches: [codex/monid-check-20261112]
    paths: [.github/workflows/monid-connection-check.yml]
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover search and comment endpoints
        env:
          MONID_SECRET: ${{ secrets.monid_key }}
          NO_COLOR: '1'
        run: |
          set -e
          npm install --prefix "$RUNNER_TEMP/monid" @monid-ai/cli@0.1.9 --no-audit --no-fund
          M="$RUNNER_TEMP/monid/node_modules/.bin/monid"
          "$M" keys add -k "$MONID_SECRET" -l github-action
          unset MONID_SECRET
          "$M" discover -q "reddit search posts comments" -l 8
          "$M" discover -q "threads search posts comments" -l 8
