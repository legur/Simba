name: Simba video — private GitHub Secrets render

on:
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: "Read-only voice/model access check; NEVER synthesize audio"
        required: false
        default: false
        type: boolean
      source_zip_file_id:
        description: "Private Drive ZIP file ID (video-spec.json plus referenced media only)"
        required: true
        type: string
      destination_folder_id:
        description: "Private owner-only Drive destination folder ID"
        required: true
        type: string

permissions:
  contents: read

# One global paid lane. The permanent Drive marker supplies cross-run replay
# protection, including after a timeout or an ambiguous provider response.
concurrency:
  group: simba-video-private-paid-render
  cancel-in-progress: false

jobs:
  render:
    name: Validate, render once, and archive privately
    if: >-
      !inputs.diagnostics_only &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout trusted main without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install trusted renderer dependencies
        working-directory: integrations/video
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-github.lock
          npm ci --ignore-scripts
          npx --no-install playwright-core install chromium
          HYPERFRAMES_NO_TELEMETRY=1 npx --no-install hyperframes browser ensure
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          command -v node
          node --input-type=module -e "import { chromium } from 'playwright-core'; const browser = await chromium.launch(); await browser.close()"

      - name: Prepare Whisper model before any paid request
        run: python -c "from faster_whisper import WhisperModel; WhisperModel('small', device='cpu', compute_type='int8')"

      - name: Run offline security tests before any credentialed step
        run: |
          python -m unittest discover -s integrations/video/tests -p 'test_github_secret*.py' -v
          python -m unittest discover -s integrations/video/tests -p 'test_simba_voice*.py' -v
          python -m unittest discover -s integrations/video/tests -p 'test_renderer_choice.py' -v
          python -m unittest discover -s integrations/video/hyperframes_backend -t integrations/video -p 'test_adapter.py' -v

      - name: Verify exact trusted checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          git diff --exit-code HEAD --

      - name: Render exactly once and upload only verified private outputs
        env:
          # User input is transported only through quoted environment variables;
          # the Python helper validates the strict Drive-ID grammar before use.
          SOURCE_ZIP_FILE_ID: ${{ inputs.source_zip_file_id }}
          DESTINATION_FOLDER_ID: ${{ inputs.destination_folder_id }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          HF_HUB_OFFLINE: "1"
        run: |
          python integrations/video/github_secret_job.py run \
            --source-zip-file-id "$SOURCE_ZIP_FILE_ID" \
            --destination-folder-id "$DESTINATION_FOLDER_ID" \
            --repo-root "$GITHUB_WORKSPACE" \
            --runner-temp "$RUNNER_TEMP"

  diagnose:
    name: Read-only approved Google voice diagnosis (NO synthesis)
    if: >-
      inputs.diagnostics_only &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install official Drive clients before credentials are supplied
        run: python -m pip install "google-api-python-client>=2.140,<3" "google-auth>=2.30,<3" "google-auth-httplib2>=0.2,<1"
      - name: Read private voice metadata and Google resource availability
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import json,os,sys,urllib.request,urllib.error
          sys.path.insert(0, 'integrations/video')
          import simba_voice as voice
          report = {"operation":"READ_ONLY_NO_SYNTHESIS","voice_metadata":"not_checked","resources":{}}
          try:
              voice._require_github_secrets_workflow()
              voice.approved_profile()
              selected = voice.voice_id_from_private_store()
              report["voice_metadata"] = "approved_private_metadata_resolved"
              key = os.environ.get("GEMINI_API_KEY","")
              if not key:
                  raise RuntimeError()
              for label, path in (
                  ("approved_voice", "voices/" + selected),
                  ("primary_model", "models/gemini-3.8-flash-tts"),
                  ("fallback_model", "models/gemini-3.8-flash-lite-tts")):
                  req = urllib.request.Request(
                      "https://generativelanguage.googleapis.com/v1beta/" + path,
                      method="GET", headers={"x-goog-api-key":key,"Accept":"application/json"})
                  try:
                      with urllib.request.urlopen(req,timeout=35) as response:
                          response.read(1024*1024)
                          report["resources"][label] = "HTTP_" + str(response.status)
                  except urllib.error.HTTPError as exc:
                      report["resources"][label] = "HTTP_" + str(exc.code)
                      exc.close()
                  except Exception:
                      report["resources"][label] = "NETWORK_OR_RESOURCE_ERROR"
          except voice.VoiceError:
              report["voice_metadata"] = "VOICE_METADATA_OR_RUNTIME_GUARD_FAILED"
          except Exception:
              report["voice_metadata"] = "READ_ONLY_SETUP_FAILED"
          print(json.dumps(report,sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("### Google voice read-only diagnosis\n\n")
              f.write("No synthesis or voice creation requested.\n\n")
              f.write("```json\n" + json.dumps(report,indent=2) + "\n```\n")
          PY
