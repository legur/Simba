name: Simba ElevenLabs available default voice previews (READ ONLY)

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  list:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.title == 'Simba ElevenLabs existing free male voice previews export 2026-11-07' &&
      github.event.issue.user.login == 'legur' &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate read-only program
        run: python -m py_compile integrations/tts/elevenlabs_default_voice_previews.py
      - name: List saved/default account male voices with pre-recorded audio previews
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python integrations/tts/elevenlabs_default_voice_previews.py
