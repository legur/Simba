name: Owner-approved Alaska active-queue one-shot backend replay

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/motionlab-alaska-active-queue-test.yml'
      - 'integrations/materials/motionlab/drive_handoff/live_approved_alaska_active_queue.py'

permissions:
  contents: read

jobs:
  replay:
    # Run only once, from the trusted repository branch. No forks.
    if: ${{ github.event.action == 'synchronize' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'test/motionlab-alaska-immediate-dispatch-run-20261112' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install trusted Google Drive OAuth modules
        run: python -m pip install --disable-pip-version-check 'google-api-python-client>=2.140,<3' 'google-auth>=2.30,<3' 'google-auth-httplib2>=0.2,<1'
      - name: Replay approved Alaska selection with fresh ticket and immediately dispatch GitHub
        env:
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: python integrations/materials/motionlab/drive_handoff/live_approved_alaska_active_queue.py

  check_receiver_response_shape:
    if: ${{ github.event.action == 'synchronize' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'test/motionlab-alaska-immediate-dispatch-run-20261112' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect ONLY malformed test ticket response without secrets
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse
          u='https://script.google.com/macros/s/AKfycbwf4RNyK_76ASvV9k-0rv2Tc-F_m-_v8TqQyWg5t0G-t5wibx7IgpXSJo2GG6Dcc1Wc/exec'
          data=urllib.parse.urlencode({
            'nonce':'11111111-1111-4111-8111-111111111111',
            'ticket_id':'Z'*32,'ticket_token':'0'*64,
            'selection_sha256':'0'*64,'selection_json':'{}'
          }).encode()
          try:
            with urllib.request.urlopen(urllib.request.Request(
              u,data=data,headers={'Content-Type':'application/x-www-form-urlencoded'}),timeout=28) as response:
              html=response.read(16000).decode('utf-8','replace')
              print('HTTP',response.status,'LENGTH',len(html))
              print('MALFORMED_TEST_ONLY_RESPONSE_PREFIX',repr(html[:1100]))
              print('HAS_RECEIPT_MARKER','SIMBA_DRIVE_INGRESS_RECEIPT' in html)
              print('HAS_MESSAGE_JS','var msg=' in html)
              marker=html.find('SIMBA_DRIVE_INGRESS_RECEIPT')
              print('MALFORMED_MARKER_CONTEXT',repr(html[max(0,marker-650):marker+550]))
          except Exception as e:
            print('MALFORMED_TEST_ONLY_HTTP_FAILED',type(e).__name__)
            raise SystemExit(2)
          PY
