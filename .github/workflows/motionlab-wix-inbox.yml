name: MotionLab Wix inbox to GitHub (NO PAID CALLS)

on:
  pull_request:
    paths:
      - '.github/workflows/motionlab-wix-inbox.yml'
      - 'integrations/materials/motionlab/queue/**'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read and validate only, do not create Git branches or ACK Wix'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: motionlab-wix-inbox-poller
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Static Python syntax and offline queue tests
        run: |
          python3 -m py_compile integrations/materials/motionlab/queue/wix_github_inbox.py
          python3 -m unittest discover -s integrations/materials/motionlab/queue -p 'test_*.py' -v

  inbox:
    needs: validate
    # No external polling or writes until Wix login + member allowlist are configured.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.MOTIONLAB_INBOX_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Fetch private inbox and persist untrusted selection receipt (no production approval)
        env:
          WIX_API_KEY: ${{ secrets.MOTIONLAB_WIX_API_KEY }}
          WIX_SITE_ID: '795efbc2-50c4-435e-939e-537cb2df75c7'
          MOTIONLAB_WIX_OWNER_ID: ${{ secrets.MOTIONLAB_WIX_OWNER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = 'true' ]; then
            python3 integrations/materials/motionlab/queue/wix_github_inbox.py --dry-run
          else
            python3 integrations/materials/motionlab/queue/wix_github_inbox.py
          fi
