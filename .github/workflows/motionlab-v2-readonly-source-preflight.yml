name: "Studio Motion Lab v2 owner-private read-only source gate (NO PAID)"

on:
  pull_request:
    paths:
      - '.github/workflows/motionlab-v2-readonly-source-preflight.yml'
      - 'integrations/materials/motionlab_v2_stage_writeback.py'
      - 'integrations/materials/test_motionlab_v2_readonly_preflight.py'
      - 'integrations/materials/studio_v2_audio_stage.py'
      - 'integrations/video/motionlab_v2_audio_gate.py'
      - 'integrations/video/motionlab_v2_contract.py'

permissions:
  contents: read

jobs:
  offline_v2_source_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install only offline renderer import dependencies
        run: python -m pip install --disable-pip-version-check numpy soundfile pillow
      - name: Strict private source and canonical v2 metadata stage tests
        run: |
          python -m py_compile integrations/materials/motionlab_v2_stage_writeback.py
          python -m unittest discover -s integrations/materials -p test_motionlab_v2_readonly_preflight.py -v
