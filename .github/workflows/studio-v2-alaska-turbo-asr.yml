name: "Studio v2 Alaska third offline turbo ASR (NO PAID / NO RENDER)"

on:
  pull_request:
    paths:
      - '.github/workflows/studio-v2-alaska-turbo-asr.yml'
      - 'integrations/video/alaska_private_turbo_asr.py'
      - 'integrations/video/tests/test_alaska_private_turbo_asr.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/studio-v2-alaska-turbo-asr.yml'

permissions:
  contents: read

concurrency:
  group: simba-alaska-private-turbo-asr-one-time
  cancel-in-progress: false

jobs:
  synthetic_contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Run offline redacted ASR contract only
        run: |
          python -m py_compile integrations/video/alaska_private_turbo_asr.py
          python -m unittest discover -s integrations/video/tests -p 'test_alaska_private_turbo_asr.py' -v

  owner_private_third_asr:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'legur/Simba'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Verify exact trusted main commit before provider credentials
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "legur/Simba"
          git diff --exit-code HEAD --
      - name: Install offline multilingual ASR and owner Drive client
        run: |
          python -m pip install --disable-pip-version-check \
            'faster-whisper==1.2.1' \
            'google-api-python-client>=2.140,<3' \
            'google-auth>=2.30,<3' 'google-auth-httplib2>=0.2,<1'
      - name: Preload only PUBLIC turbo model weights before private media access
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python - <<'PY'
          from faster_whisper import WhisperModel
          WhisperModel('large-v3-turbo', device='cpu', compute_type='int8')
          print('PUBLIC_TURBO_MODEL_CACHED')
          PY
      - name: SHA-pinned private WAV/music, offline unprompted turbo, owner Drive JSON only
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_OFFLINE: "1"
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: python integrations/video/alaska_private_turbo_asr.py
      - name: Explicit no-approval summary
        if: always()
        run: |
          echo "Only redacted counts/indices saved in owner-private Drive; never source text, tokens, WAV or MP3." >> "$GITHUB_STEP_SUMMARY"
          echo "Third Whisper model is diagnostic, not new independent CTC or automatic v2 approval. No TTS/A2E/paid provider/render/publish." >> "$GITHUB_STEP_SUMMARY"
