name: Simba Motion Lab PR112 selection → Montage edit_choice (NO PAID CALLS)

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Already approved Simba project ID"
        required: true
        type: string
      launch_file_id:
        description: "Private Drive Motion Lab launch JSON ID"
        required: true
        type: string
      launch_sha256:
        description: "SHA256 of exact launch JSON bytes"
        required: true
        type: string
      selection_file_id:
        description: "Private Drive connected-session selection JSON ID"
        required: true
        type: string
      selection_sha256:
        description: "SHA256 of exact selected JSON bytes"
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/simba-motionlab-stage-writeback.yml'
      - 'integrations/materials/motionlab_stage_writeback.py'
      - 'integrations/materials/test_motionlab_stage_writeback.py'
      - 'integrations/materials/motionlab/motionlab_selection.py'
      - 'integrations/materials/handoff.py'

permissions:
  contents: read

concurrency:
  group: simba-motionlab-edit-choice-writeback-global
  cancel-in-progress: false

jobs:
  offline_tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Existing Motion Lab validation and Stage 5G regression (no Drive/paid calls)
        run: |
          python -m unittest discover -s integrations/materials/motionlab/repo-tests -p test_motionlab_selection.py -v
          python -m unittest discover -s integrations/materials -p test_motionlab_stage_writeback.py -v

  owner_writeback:
    # This cannot fake the browser ACK: only actual persisted accepted source
    # changes the canonical project record. No A2E/Gemini/music/render tokens.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'legur/Simba' &&
      github.actor == 'legur' &&
      github.triggering_actor == 'legur' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check caller, canonical main and valid identifiers
        shell: bash
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          LAUNCH_ID: ${{ inputs.launch_file_id }}
          LAUNCH_SHA: ${{ inputs.launch_sha256 }}
          SELECT_ID: ${{ inputs.selection_file_id }}
          SELECT_SHA: ${{ inputs.selection_sha256 }}
        run: |
          set -euo pipefail
          [[ "$PROJECT_ID" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]
          [[ "$LAUNCH_ID" =~ ^[A-Za-z0-9_-]{10,128}$ ]]
          [[ "$SELECT_ID" =~ ^[A-Za-z0-9_-]{10,128}$ ]]
          [[ "$LAUNCH_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SELECT_SHA" =~ ^[0-9a-f]{64}$ ]]
          test "$LAUNCH_ID" != "$SELECT_ID"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test -f "campaigns/$PROJECT_ID/project.json"
      - name: Install read-only Google Drive OAuth dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'google-api-python-client>=2.140,<3' 'google-auth>=2.30,<3' \
            'google-auth-httplib2>=0.2,<1'
      - name: Fetch two owner-private JSON files, validate connected selection, write only project stage
        shell: bash
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          LAUNCH_ID: ${{ inputs.launch_file_id }}
          LAUNCH_SHA: ${{ inputs.launch_sha256 }}
          SELECT_ID: ${{ inputs.selection_file_id }}
          SELECT_SHA: ${{ inputs.selection_sha256 }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python integrations/materials/motionlab_stage_writeback.py \
            --project "$PROJECT_ID" \
            --launch-file-id "$LAUNCH_ID" \
            --launch-sha256 "$LAUNCH_SHA" \
            --selection-file-id "$SELECT_ID" \
            --selection-sha256 "$SELECT_SHA" \
            --apply --report "$RUNNER_TEMP/motionlab-stage-receipt.json"
          test "$(git diff --name-only)" = "campaigns/$PROJECT_ID/project.json"
          python integrations/materials/catalog.py check
          python integrations/materials/handoff.py --report-only "$PROJECT_ID"
      - name: Commit verified choice only; existing dispatcher handles MONTAGE_RENDERER
        shell: bash
        env:
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name "simba-studio-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "campaigns/$PROJECT_ID/project.json"
          test "$(git diff --cached --name-only)" = "campaigns/$PROJECT_ID/project.json"
          git commit -m "chore(studio): record selected Motion Lab edit plan for $PROJECT_ID"
          git push origin HEAD:main
      - name: Publish redacted receipt — no browser ACK or rendering
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/motionlab-stage-receipt.json" ]; then
            echo '### Simba Motion Lab selected edit plan (read-only media)' >> "$GITHUB_STEP_SUMMARY"
            python - "$RUNNER_TEMP/motionlab-stage-receipt.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          row=json.load(open(sys.argv[1],encoding='utf-8'))
          for k in ('status','project_id','selection_number','source_scene_count',
                    'next_recipient','paid_calls','actual_render_started',
                    'auto_publish','project_written','browser_ack_sent'):
              print(f'{k}: {row.get(k)}')
          PY
          fi
      - name: Keep only non-sensitive verification metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simba-motionlab-stage-receipt
          path: ${{ runner.temp }}/motionlab-stage-receipt.json
          retention-days: 14
          if-no-files-found: warn
