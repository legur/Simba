name: MotionLab — issue one-use private Google Drive launch ticket

on:
  pull_request:
    paths:
      - 'integrations/materials/motionlab/drive_handoff/**'
      - 'integrations/materials/motionlab/repo-tests/test_drive_handoff.mjs'
      - '.github/workflows/motionlab-drive-ticket.yml'
  workflow_dispatch:
    inputs:
      launch_file_id:
        description: 'ID of approved storyboard launch/v1 in private Drive Launches folder'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'google-api-python-client>=2.140,<3' 'google-auth>=2.30,<3' 'google-auth-httplib2>=0.2,<1'
      - run: |
          python -m unittest discover -s integrations/materials/motionlab/drive_handoff -p 'test_*.py' -v
          node --test integrations/materials/motionlab/repo-tests/test_drive_handoff.mjs

  ticket:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'google-api-python-client>=2.140,<3' 'google-auth>=2.30,<3' 'google-auth-httplib2>=0.2,<1'
      - name: Issue approved private Drive ticket (no secrets in output)
        env:
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          MOTIONLAB_APPROVED_LAUNCH_ID: ${{ inputs.launch_file_id }}
        run: |
          python integrations/materials/motionlab/drive_handoff/issue_ticket.py --launch-file-id "$MOTIONLAB_APPROVED_LAUNCH_ID"
