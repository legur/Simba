name: Simba Gemini other male voices Prague (no A2E)

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: simba-gemini-additional-male-20261107-once
  cancel-in-progress: false

jobs:
  synth:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.title == 'Simba Gemini Iapetus Algenib Prague 2026-11-07 ONE SHOT' &&
      github.event.issue.user.login == 'legur' &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate files, no paid calls yet
        run: |
          python -m py_compile integrations/tts/gemini_male_additional_once.py integrations/tts/run_male_prague.py
          python -m json.tool integrations/tts/prague_male_voices.json > /dev/null
      - name: Install Drive client
        run: python -m pip install "google-api-python-client>=2.140,<3" "google-auth>=2.30,<3" "google-auth-httplib2>=0.2,<1"
      - name: Generate only Gemini male voices and verify private WAVs
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: python integrations/tts/gemini_male_additional_once.py
      # Intentionally omit upload-artifact. Audio stays in private Google Drive.
