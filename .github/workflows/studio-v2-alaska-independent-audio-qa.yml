name: "Studio v2 Alaska CTC scalar timestamps v3 (NO PAID / NO PUBLISH)"

on:
  pull_request:
    paths:
      - '.github/workflows/studio-v2-alaska-independent-audio-qa.yml'
      - 'integrations/video/alaska_private_dual_audio_preflight.py'
      - 'integrations/video/tests/test_alaska_private_dual_audio_preflight.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/studio-v2-alaska-independent-audio-qa.yml'

permissions:
  contents: read

concurrency:
  group: simba-alaska-private-asr-ctc-scalars-v3-one-time
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Syntax only — real audio cannot enter PR jobs
        run: |
          python -m py_compile integrations/video/alaska_private_dual_audio_preflight.py
          python -m unittest discover -s integrations/video/tests -p test_alaska_private_dual_audio_preflight.py -v

  private_real_audio:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'legur/Simba'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Exact trusted main checkout (no persistent GitHub token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Confirm trusted runtime, only private source pinned by SHA
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REPOSITORY" = "legur/Simba"
          test "$GITHUB_REF" = "refs/heads/main"
          test -f .github/workflows/studio-v2-alaska-independent-audio-qa.yml
          command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y ffmpeg; }
          git diff --exit-code HEAD --
      - name: Install local ASR engines and official Drive OAuth client
        run: |
          python -m pip install --disable-pip-version-check \
            'whisperx==3.8.6' 'faster-whisper==1.2.1' \
            'google-api-python-client>=2.140,<3' \
            'google-auth>=2.30,<3' 'google-auth-httplib2>=0.2,<1'
      - name: Download PUBLIC model weights BEFORE accessing private WAV
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python - <<'PY'
          from faster_whisper import WhisperModel
          WhisperModel('small', device='cpu', compute_type='int8')
          print('PUBLIC_ASR_WEIGHTS_AVAILABLE')
          PY
      - name: Exact-byte private WAV+music, independent CTC/ASR with finite numeric word timestamps, private JSON v3 only
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          python integrations/video/alaska_private_dual_audio_preflight.py --owner-once
      - name: No GitHub audio artifact or public output
        if: always()
        run: |
          echo "No new TTS, A2E, render, paid API, public transcript or published video." >> "$GITHUB_STEP_SUMMARY"
          echo "Result, if model inference completed, is saved as one private Drive JSON diagnostic." >> "$GITHUB_STEP_SUMMARY"
