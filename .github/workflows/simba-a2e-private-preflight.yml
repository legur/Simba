name: Simba Rafael to existing A2E private preflight (NO PAID CALLS)

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Approved Simba project ID (no secrets)"
        required: true
        type: string
      plan_file_id:
        description: "Approved private Google Drive A2E plan ID"
        required: true
        type: string
      storyboard_file_id:
        description: "Approved private Google Drive Rafael ZIP ID"
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/simba-a2e-private-preflight.yml'
      - 'integrations/video/github_a2e_private.py'
      - 'integrations/video/test_github_a2e_private.py'
      - 'integrations/video/github_a2e_universal.py'
      - 'integrations/materials/rafael_a2e_handoff.py'
      - 'integrations/materials/rafael_archive.py'

permissions:
  contents: read

concurrency:
  group: simba-a2e-private-source-preflight
  cancel-in-progress: false

jobs:
  offline_tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Test synthetic private ZIP to Wix to existing A2E (NO A2E calls)
        run: python -m unittest integrations/video/test_github_a2e_private.py -v

  live_readonly_preflight:
    # Manual owner-only dispatch; no labels, no paid A2E key, no Issues write permission.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'legur/Simba' &&
      github.actor == 'legur' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13' 'google-api-python-client>=2.140,<3' 'google-auth>=2.30,<3' 'google-auth-httplib2>=0.2,<1'
      - name: Read-only private Drive and Wix verification
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          PLAN_FILE_ID: ${{ inputs.plan_file_id }}
          STORYBOARD_FILE_ID: ${{ inputs.storyboard_file_id }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python integrations/video/github_a2e_private.py \
            --project "$PROJECT_ID" \
            --plan-file-id "$PLAN_FILE_ID" \
            --storyboard-file-id "$STORYBOARD_FILE_ID" \
            > "$RUNNER_TEMP/a2e-private-preflight.json"
          python - "$RUNNER_TEMP/a2e-private-preflight.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          row=json.load(open(sys.argv[1],encoding='utf-8'))
          print('### Simba Rafael → existing universal A2E (READ ONLY)')
          for key in ('status','project_id','selected_storyboard','selected_prompts',
                      'verified_scene_count','recorded_approved_max_credits',
                      'actual_A2E_quote_checked','github_issue_created','a2e_paid_calls'):
              print(f'{key}: {row.get(key)}')
          PY
