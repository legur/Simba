name: Motion Lab transition contract

on:
  pull_request:
    paths:
      - 'integrations/video/**'
      - '.github/workflows/motion-lab-transitions.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/video/**'
      - '.github/workflows/motion-lab-transitions.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Minimal no-provider test dependencies
        run: python -m pip install numpy soundfile

      - name: Check syntax
        run: |
          python -m py_compile integrations/video/make_video.py integrations/video/hyperframes_backend/adapter.py
          node --check integrations/video/template/transitions.js
          node --check integrations/video/template/film.js

      - name: Motion Lab contract tests
        run: python -m unittest discover -s integrations/video/tests -p 'test_motion_lab_transitions.py' -v
